<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <!-- Include the same stylesheet as index.html -->
    <link rel="stylesheet" href="../styles/style.css">
    <!-- Include DotGothic16 font for a terminal-like theme -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            color: rgb(0, 255, 0);
            font-family: 'DotGothic16', monospace;
            margin: 0;
            padding: 0;
            text-shadow: 0 0 2px rgb(0, 255, 0), 0 0 4px rgb(0, 255, 0), 0 0 8px rgba(0, 255, 0, 0.5);
            cursor: url('Icons/neuralcursor.gif'), auto; /* Custom cursor with forward slashes */
        }

        header nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            background-color: black;
            border-bottom: 2px solid rgb(0, 255, 0);
        }

        header nav ul li {
            margin: 0 15px;
        }

        header nav ul li a {
            text-decoration: none;
            color: rgb(0, 255, 0);
            font-size: 18px;
        }

        header nav ul li a:hover {
            text-shadow: 0 0 10px rgb(0, 255, 0);
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
            border-bottom: 2px solid rgb(0, 255, 0);
        }

        .content {
            text-align: center;
            padding: 30px 20px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: black;
            color: rgb(0, 255, 0);
            border: 2px solid rgb(0, 255, 0);
            text-decoration: none;
            font-family: 'DotGothic16', monospace;
        }

        .button:hover {
            background-color: rgb(0, 255, 0);
            color: black;
            text-shadow: none;
        }

        footer {
            text-align: center;
            padding: 10px 0;
            border-top: 2px solid rgb(0, 255, 0);
            background-color: black;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to My Website</h1>
            <p>Your one-stop destination for all things tech and creativity.</p>
        </section>
        <section class="content">
            <h2>Featured Projects</h2>
            <p>Check out some of my latest work and exciting projects.</p>
            <a href="projects.html" class="button">View Projects</a>
        </section>
    </main>
    <footer>
        <p>&copy; 2023-2025 Jaybird. All rights reserved.</p>
    </footer>
</body>
</html>
